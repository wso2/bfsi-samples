is.base.url=https://localhost:9446

# OAuth Configuration
oauth.client.id=ujhfowXZYFg0nEROV2lfompmLYMa
oauth.client.kid=af6e693b-4e77-468d-80c0-367ab4a29354
oauth.algorithm=PS256
oauth.token.type=JWT
oauth.token.url=https://localhost:9446/oauth2/token
oauth.authorize.url=https://localhost:9446/oauth2/authorize
oauth.redirect.uri=https://localhost:9446/api-ob-demo-1.0.0/callback
oauth.response.type=code

# Ask for the authorization response as a signed JWT (JARM)
oauth.response.mode=jwt

# Make the Identity Server re-authenticate the customer on every bank authorization instead of
# reusing an existing single sign on session, so the consent redirect always shows the login
# page. This covers only the authorization the demo is about; signing in to the application
# itself deliberately still uses single sign on. Leave empty to let the server reuse its session.
oauth.prompt=login

# Access token claim carrying the consent id created by the authorization. Must match the
# Identity Server's consent_id_claim_name, and the server must add the claim to access tokens.
oauth.consent.id.claim=consent_id

# Pushed Authorization Request endpoint. The Rich Authorization Request is always pushed here,
# and always carries a PKCE code challenge.
oauth.par.url=https://localhost:9446/oauth2/par

# Open Banking API URLs
openbanking.account.base.url=https://localhost:8243/open-banking/v1.0/account-information
openbanking.payment.base.url=https://localhost:8243/open-banking/v1.0/payment-initiation

cors.allowed.origin=*

# Detached JWS sent on a payment submission. This demo does not sign its request bodies.
openbanking.jws.signature=placeholder-jws-signature

# SSL/TLS Configuration
ssl.certificate.path=/obtransport.pem
ssl.key.path=/obtransport.key
ssl.truststore.path=/client-truststore.jks
ssl.truststore.password=123456

# Backend Configuration
backend.base.url=https://localhost:9446/api-ob-demo-1.0.0/init

# Frontend Configuration
frontend.home.url=https://localhost:9446/api-ob-demo-1.0.0
